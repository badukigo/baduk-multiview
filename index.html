<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>기보 비교 분석기</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--panel:#151b26;--raised:#1e2638;--border:#2a344a;--blue:#4f6bff;--cyan:#06b6d4;--muted:#94a3b8;--text:#e5eaf4;--wood:#d89b53;--line:#3e2713}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Pretendard,system-ui,sans-serif;min-width:780px}button,input{font:inherit}button{color:inherit;cursor:pointer;border:1px solid var(--border);background:var(--raised);border-radius:8px;padding:8px 12px;transition:.15s}button:hover{border-color:#687895;background:#273149}button.active,.primary{background:var(--blue);border-color:var(--blue);color:white}.app{height:100vh;display:grid;grid-template-rows:64px 1fr 86px;gap:12px;padding:12px 18px}.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--border);padding:0 4px 10px}.brand{font-size:19px;font-weight:750;letter-spacing:-.03em;white-space:nowrap}.brand span{color:#91a2ff}.sub{color:var(--muted);font-size:12px;margin-left:8px}.spacer{flex:1}.group{display:flex;gap:6px}.status{font-size:12px;color:#8fe2c3}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;min-height:0}.boards.two{grid-template-rows:1fr}.boards.two .board-card:nth-child(n+3){display:none}.board-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-height:0;padding:10px;display:flex;flex-direction:column;position:relative}.board-card.focus{border-color:var(--blue);box-shadow:0 0 0 1px #4f6bff35}.card-head{height:34px;display:flex;align-items:center;gap:8px;flex-shrink:0}.badge{font-size:10px;color:#b4c1ff;background:#252e49;padding:4px 7px;border-radius:5px}.players{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.moves{margin-left:auto;color:#cbd5e1;font:12px 'JetBrains Mono',monospace}.canvas-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.goban{width:min(100%,calc(100vh - 280px));height:100%;max-width:100%;aspect-ratio:1;background:var(--wood);border-radius:3px;box-shadow:0 8px 24px #0007;display:block}.empty{position:absolute;inset:8px;border:1px dashed #46536c;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9ba9bf;background:#151b26e8;cursor:pointer}.empty:hover{border-color:var(--blue);color:white}.plus{font-size:28px;color:#8294ff;margin-bottom:8px}.empty small{display:block;color:#728099;margin-top:6px}.side{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto}.side h2{font-size:14px;margin:0 0 14px}.side .hint{color:var(--muted);line-height:1.65;font-size:12px}.divider{height:1px;background:var(--border);margin:16px 0}.meta{display:grid;grid-template-columns:48px 1fr;gap:10px 8px;font-size:12px}.meta dt{color:#77859c}.meta dd{margin:0;color:#d6deeb}.tag{color:#71dfb3}.history{display:flex;flex-wrap:wrap;gap:5px}.stone-chip{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font:10px monospace;background:#202735;border:1px solid #3a465b;color:#d5deed}.stone-chip.current{background:var(--blue);border-color:var(--blue)}.bottom{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px}.bottom button{min-width:42px}.scrub{flex:1;display:flex;align-items:center;gap:12px;margin:0 12px}.scrub input{width:100%;accent-color:var(--blue)}.mono{font:12px 'JetBrains Mono',monospace;color:#cbd5e1;white-space:nowrap}.sync{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}.sync input{accent-color:var(--cyan)}.toast{position:fixed;top:76px;right:24px;background:#3b1822;border:1px solid #f43f5e;color:#fecdd3;border-radius:8px;padding:10px 14px;display:none;z-index:3}.toast.show{display:block}@media(max-height:760px){.app{grid-template-rows:56px 1fr 74px}.board-card{padding:7px}.side{padding:12px}.goban{width:min(100%,calc(100vh - 230px))}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand">기보 <span>비교 분석기</span></div><div class="sub">MULTI-VIEW SGF ANALYZER</div></div><div class="spacer"></div><span style="color:var(--muted);font-size:12px">레이아웃</span><div class="group"><button class="active" id="twoBtn">2분할</button><button id="fourBtn">4분할</button></div><button id="batchBtn">일괄 업로드</button><input id="batchInput" type="file" accept=".sgf" multiple hidden><span class="status" id="status">● 로컬 분석 준비</span></header>
<main class="main"><section class="boards two" id="boards"></section><aside class="side"><h2>대국 정보 <span class="badge" id="activeBadge">BOARD 01</span></h2><div class="hint" id="sideEmpty">보드를 선택하면 기보 정보가 여기에 표시됩니다.<br><br>각 칸을 클릭하거나 SGF 파일을 끌어 놓아 기보를 불러오세요.</div><dl class="meta" id="metadata" hidden></dl><div class="divider"></div><h2>수순 히스토리</h2><div class="history" id="history"><span class="hint">기보를 불러오면 수순이 표시됩니다.</span></div><div class="divider"></div><h2>빠른 조작</h2><div class="hint">← / → 한 수 이동<br>Shift + ← / → 10수 이동<br>Space 재생 · Home 처음 · End 끝<br>S 동기화 전환 · 1–4 보드 선택</div></aside></main>
<footer class="bottom"><button title="처음" id="home">|◀</button><button title="10수 뒤로" id="back10">−10</button><button title="이전 수" id="back">◀</button><button title="재생/일시정지" id="play">▶</button><button title="다음 수" id="next">▶</button><button title="10수 앞으로" id="next10">+10</button><button title="끝" id="end">▶|</button><div class="scrub"><span class="mono" id="counter">0 / 0</span><input type="range" id="slider" min="0" max="0" value="0"><span class="mono" id="maxCounter">MAX 0</span></div><label class="sync"><input type="checkbox" id="sync" checked> 수순 동기화</label></footer></div><div class="toast" id="toast"></div>
<script>
const N=19, star=[3,9,15], games=[null,null,null,null];let count=2,active=0,sync=true,timer=null;
const boards=document.getElementById('boards');
function makeCard(i){let card=document.createElement('article');card.className='board-card';card.dataset.i=i;card.innerHTML=`<div class="card-head"><span class="badge">BOARD 0${i+1}</span><span class="players">대국을 불러오세요</span><span class="moves">—</span></div><div class="canvas-wrap"><canvas class="goban" aria-label="바둑판"></canvas><label class="empty"><input type="file" accept=".sgf" hidden><div><div class="plus">＋</div><strong>클릭하여 SGF 파일 업로드</strong><small>또는 파일을 이 영역에 드래그</small></div></label></div>`;card.addEventListener('click',()=>focus(i));let input=card.querySelector('input');input.addEventListener('change',e=>{if(e.target.files[0])loadFile(i,e.target.files[0])});let drop=card.querySelector('.canvas-wrap');drop.addEventListener('dragover',e=>{e.preventDefault()});drop.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadFile(i,e.dataTransfer.files[0])});return card}
function renderCards(){boards.className='boards '+(count===2?'two':'four');boards.innerHTML='';for(let i=0;i<count;i++)boards.append(makeCard(i));drawAll()}
function boardDraw(canvas,g){let dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect(),size=Math.floor(Math.min(rect.width,rect.height));if(size<2)return;canvas.width=size*dpr;canvas.height=size*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);let pad=size*.055,step=(size-2*pad)/(N-1);c.fillStyle='#d89b53';c.fillRect(0,0,size,size);c.strokeStyle='#3e2713';c.lineWidth=Math.max(1,size/850);for(let k=0;k<N;k++){c.beginPath();c.moveTo(pad+k*step,pad);c.lineTo(pad+k*step,pad+18*step);c.stroke();c.beginPath();c.moveTo(pad,pad+k*step);c.lineTo(pad+18*step,pad+k*step);c.stroke()}for(let x of star)for(let y of star){c.beginPath();c.arc(pad+x*step,pad+y*step,Math.max(2,size*.006),0,Math.PI*2);c.fillStyle='#3e2713';c.fill()}if(!g)return;let state=position(g,g.pos);state.stones.forEach((s,key)=>{let [x,y]=key.split(',').map(Number),cx=pad+x*step,cy=pad+y*step,r=step*.46;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);let gr=c.createRadialGradient(cx-r*.3,cy-r*.35,r*.05,cx,cy,r);gr.addColorStop(0,s==='B'?'#4b4b50':'#fff');gr.addColorStop(1,s==='B'?'#111114':'#e5e5e7');c.fillStyle=gr;c.shadowColor='#0006';c.shadowBlur=3;c.shadowOffsetY=1;c.fill();c.shadowColor='transparent';if(state.last===key){c.beginPath();c.arc(cx,cy,r*.34,0,Math.PI*2);c.strokeStyle=s==='B'?'#ef4444':'#2563eb';c.lineWidth=Math.max(2,size*.009);c.stroke()}})}
function position(g,n){let stones={};for(const [x,y,col] of g.setup)stones[`${x},${y}`]=col;let last=null;for(let i=0;i<Math.min(n,g.moves.length);i++){let m=g.moves[i];if(m.pass)continue;let key=`${m.x},${m.y}`;stones[key]=m.color;last=key}return{stones,last}}
function drawAll(){document.querySelectorAll('.board-card').forEach(card=>{let i=+card.dataset.i,g=games[i],canvas=card.querySelector('canvas');boardDraw(canvas,g);card.classList.toggle('focus',i===active);card.querySelector('.empty').style.display=g?'none':'flex';card.querySelector('.players').textContent=g?`${g.info.PB||'흑'} vs ${g.info.PW||'백'}`:'대국을 불러오세요';card.querySelector('.moves').textContent=g?`#${g.pos}`:'—'}) ;updateInfo()}
function parseSGF(text){let nodes=[...text.matchAll(/\((?:;[^()]*)+/gs)];if(!nodes.length)throw Error('SGF 내용을 읽을 수 없습니다.');let body=nodes[0][0];let props={};for(let m of body.matchAll(/([A-Z]{1,2})((?:\[[^\]]*\])+)/g)){let vals=[...m[2].matchAll(/\[([^\]]*)\]/g)].map(x=>x[1].replace(/\\(.)/g,'$1'));props[m[1]]=vals}let size=+(props.SZ?.[0]||19);if(size!==19)throw Error('현재 초안은 19×19 기보를 지원합니다.');let setup=[];for(let [tag,col] of [['AB','B'],['AW','W']])for(let p of props[tag]||[]){let [x,y]=coord(p);setup.push([x,y,col])}let moves=[];for(let m of body.matchAll(/;\s*([BW])\[([^\]]*)\]/g)){if(!m[2])moves.push({color:m[1],pass:true});else{let [x,y]=coord(m[2]);moves.push({color:m[1],x,y})}}return{info:{PB:props.PB?.[0],PW:props.PW?.[0],DT:props.DT?.[0],KM:props.KM?.[0],RE:props.RE?.[0],BR:props.BR?.[0],WR:props.WR?.[0]},setup,moves,pos:0,name:''}}
function coord(s){if(!/^[a-s]{2}$/i.test(s))throw Error('올바르지 않은 착점 좌표입니다.');return[s.toLowerCase().charCodeAt(0)-97,s.toLowerCase().charCodeAt(1)-97]}
function loadFile(i,file){if(!file.name.toLowerCase().endsWith('.sgf')){toast('지원하지 않는 파일 형식입니다. .sgf 파일만 업로드해 주세요.');return}let reader=new FileReader();reader.onload=()=>{try{let g=parseSGF(reader.result);g.name=file.name;games[i]=g;focus(i);document.getElementById('status').textContent='● SGF 파싱 완료';drawAll()}catch(err){toast(err.message||'파일을 불러오는 중 오류가 발생했습니다. 파일 경로를 확인해 주세요.')}};reader.onerror=()=>toast('파일을 불러오는 중 오류가 발생했습니다. 파일 경로를 확인해 주세요.');reader.readAsText(file)}
function focus(i){if(i>=count)return;active=i;drawAll()};function maxMoves(){return Math.max(0,...games.slice(0,count).filter(Boolean).map(g=>g.moves.length))}
function moveTo(n,only=false){let target=Math.max(0,Math.min(maxMoves(),n));for(let i=0;i<count;i++){let g=games[i];if(g&&(!only||i===active))g.pos=Math.min(target,g.moves.length)}drawAll()}
function updateInfo(){let g=games[active],empty=document.getElementById('sideEmpty'),meta=document.getElementById('metadata'),hist=document.getElementById('history');document.getElementById('activeBadge').textContent=`BOARD 0${active+1}`;empty.hidden=!!g;meta.hidden=!g;if(g){meta.innerHTML=`<dt>흑</dt><dd>${g.info.PB||'—'} ${g.info.BR||''}</dd><dt>백</dt><dd>${g.info.PW||'—'} ${g.info.WR||''}</dd><dt>날짜</dt><dd>${g.info.DT||'—'}</dd><dt>덤</dt><dd>${g.info.KM||'—'}</dd><dt>결과</dt><dd class="tag">${g.info.RE||'진행 중'}</dd><dt>파일</dt><dd>${g.name}</dd>`;hist.innerHTML='<span class="stone-chip">0</span>'+g.moves.slice(0,g.pos).slice(-18).map((m,j)=>`<span class="stone-chip ${j===Math.min(g.pos,18)-1?'current':''}">${Math.max(1,g.pos-17+j)}</span>`).join('')}else hist.innerHTML='<span class="hint">기보를 불러오면 수순이 표시됩니다.</span>';let total=maxMoves(),pos=g?.pos||0,slider=document.getElementById('slider');slider.max=total;slider.value=pos;document.getElementById('counter').textContent=`${pos} / ${g?.moves.length||0}`;document.getElementById('maxCounter').textContent=`MAX ${total}`}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
document.getElementById('twoBtn').onclick=()=>setLayout(2);document.getElementById('fourBtn').onclick=()=>setLayout(4);function setLayout(n){count=n;document.getElementById('twoBtn').classList.toggle('active',n===2);document.getElementById('fourBtn').classList.toggle('active',n===4);if(active>=n)active=0;renderCards()}
document.getElementById('batchBtn').onclick=()=>document.getElementById('batchInput').click();document.getElementById('batchInput').onchange=e=>[...e.target.files].slice(0,count).forEach((f,i)=>loadFile(i,f));document.getElementById('sync').onchange=e=>sync=e.target.checked;document.getElementById('home').onclick=()=>moveTo(0);document.getElementById('back').onclick=()=>moveTo((games[active]?.pos||0)-1,!sync);document.getElementById('next').onclick=()=>moveTo((games[active]?.pos||0)+1,!sync);document.getElementById('back10').onclick=()=>moveTo((games[active]?.pos||0)-10,!sync);document.getElementById('next10').onclick=()=>moveTo((games[active]?.pos||0)+10,!sync);document.getElementById('end').onclick=()=>{for(let i=0;i<count;i++)if(games[i])games[i].pos=games[i].moves.length;drawAll()};document.getElementById('slider').oninput=e=>moveTo(+e.target.value);document.getElementById('play').onclick=togglePlay;function togglePlay(){if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶'}else{document.getElementById('play').textContent='Ⅱ';timer=setInterval(()=>{let p=games[active]?.pos||0;if(p>=maxMoves()){togglePlay();return}moveTo(p+1)},1000)}}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowLeft')moveTo((games[active]?.pos||0)-(e.shiftKey?10:1),!sync);else if(e.key==='ArrowRight')moveTo((games[active]?.pos||0)+(e.shiftKey?10:1),!sync);else if(e.key==='Home')moveTo(0);else if(e.key==='End')document.getElementById('end').click();else if(e.key.toLowerCase()==='s'){sync=!sync;document.getElementById('sync').checked=sync}else if('1234'.includes(e.key))focus(+e.key-1)});window.addEventListener('resize',drawAll);renderCards();
</script></body></html>
